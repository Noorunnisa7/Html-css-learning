<!DOCTYPE html>
<html>
<body>

<h2>Promise Example</h2>
<p id="demo"></p>

<script>

    let promise =  new Promise((resolve, reject) => {
    let inStock = false; // true / false try karo

    setTimeout(() => {
      if (inStock) {
        resolve("✅ Item delivered");
      } else {
        reject("❌ Item out of stock");
      }
    }, 2000);
  });
function orderItem() {
  return promise;
}

orderItem()
  .then(result => {
    document.getElementById("demo").innerHTML = result;
  })
  .catch(error => {
    document.getElementById("demo").innerHTML = error;
  });
